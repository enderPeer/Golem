[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-golem"
version = "0.1.0"
description = "A reproducible evolutionary English world and experimental terminal character model"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
golem = "english_world.cli:main"
english-world = "english_world.cli:main"

[tool.setuptools.packages.find]
include = ["english_world*"]
